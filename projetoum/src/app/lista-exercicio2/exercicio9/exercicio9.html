<div *ngFor="let produto of produtos">

  <p>{{ produto.nome }}</p>

  <p>Quantidade: {{ produto.quantidade }}</p>

  <p *ngIf="produto.quantidade === 0" [ngClass]="'vermelho'">Sem estoque</p>

  <p *ngIf="produto.quantidade >= 1 && produto.quantidade <= 5" [ngClass]="'amarelo'">Estoque baixo</p>

  <p *ngIf="produto.quantidade > 5" [ngClass]=" 'verde'">Estoque disponível</p>

</div>
